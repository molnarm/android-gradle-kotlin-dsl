---
format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

stack: linux-docker-android-22.04

app:
  envs:
  - PROJECT_LOCATION: "."
  - GRADLE_BUILD_FILE_PATH: build.gradle.kts
  - GRADLEW_PATH: "./gradlew"

workflows:
  primary:
    description: |
      Builds the project and runs all tests (unit + instrumented)
    steps:
    - git-clone@8: {}
    - cache-pull@2: {}
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: "$GRADLEW_PATH"
    - change-android-versioncode-and-versionname@1:
        inputs:
        - build_gradle_path: "$GRADLE_BUILD_FILE_PATH"
    - android-lint@0:
        inputs:
        - project_location: "$PROJECT_LOCATION"
        - variant: debug
    - android-unit-test@1:
        inputs:
        - project_location: "$PROJECT_LOCATION"
        - variant: debug
    - virtual-device-testing-for-android@1:
        inputs:
        - test_type: instrumentation
        - test_devices: "Pixel2.arm,30,en,portrait"
        - app_path: "$BITRISE_APK_PATH"
        - test_apk_path: "$BITRISE_TEST_APK_PATH"
    - android-build@1:
        inputs:
        - project_location: "$PROJECT_LOCATION"
        - module: app
        - variant: debug
    - deploy-to-bitrise-io@2: {}
    - cache-push@2: {}

  test:
    description: |
      Runs unit tests only (faster feedback)
    steps:
    - git-clone@8: {}
    - cache-pull@2: {}
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: "$GRADLEW_PATH"
    - android-lint@0:
        inputs:
        - project_location: "$PROJECT_LOCATION"
        - variant: debug
    - android-unit-test@1:
        inputs:
        - project_location: "$PROJECT_LOCATION"
        - variant: debug
    - cache-push@2: {}

trigger_map:
- push_branch: "*"
  workflow: primary
- pull_request_source_branch: "*"
  workflow: test
