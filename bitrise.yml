---
format_version: "25"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
  - PROJECT_LOCATION: "."
  - MODULE: app
  - VARIANT: Debug
  - GRADLEW_PATH: "./gradlew"

meta:
  bitrise.io:
    stack: linux-docker-android-22.04

workflows:
  primary:
    description: Builds and tests the Android app
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - restore-gradle-cache@2: {}
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: $GRADLEW_PATH
    - android-lint@0:
        inputs:
        - project_location: $PROJECT_LOCATION
        - variant: $VARIANT
        - cache_level: none
    - android-unit-test@1:
        inputs:
        - project_location: $PROJECT_LOCATION
        - variant: $VARIANT
        - cache_level: none
    - android-build@1:
        inputs:
        - project_location: $PROJECT_LOCATION
        - module: $MODULE
        - variant: $VARIANT
        - cache_level: none
    - deploy-to-bitrise-io@2: {}
    - save-gradle-cache@1: {}
    summary: Build and test the Android application
    triggers:
      push:
      - branch: "*"
      pull_request:
      - source_branch: "*"

  deploy:
    description: Build release APK
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - restore-gradle-cache@2: {}
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: $GRADLEW_PATH
    - android-build@1:
        inputs:
        - project_location: $PROJECT_LOCATION
        - module: $MODULE
        - variant: Release
        - cache_level: none
    - sign-apk@2:
        run_if: '{{getenv "BITRISEIO_ANDROID_KEYSTORE_URL" | ne ""}}'
    - deploy-to-bitrise-io@2: {}
    - save-gradle-cache@1: {}
    summary: Build release version of the app